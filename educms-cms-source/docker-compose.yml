services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: educms_db
      POSTGRES_USER: educms
      POSTGRES_PASSWORD: educms_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
