<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WeatherNow</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><h1>WeatherNow</h1><p>Search a city and fetch current weather with JavaScript.</p><form id="form"><input id="city" placeholder="Enter city" required><button>Get Weather</button></form><p id="status">Enter a city.</p><section id="card" class="hidden"><h2 id="place"></h2><div class="temp"><span id="temp"></span>°C</div><p id="desc"></p><div class="grid"><div><span>Feels like</span><strong id="feels"></strong></div><div><span>Humidity</span><strong id="humidity"></strong></div><div><span>Wind</span><strong id="wind"></strong></div><div><span>Precipitation</span><strong id="rain"></strong></div></div></section></main><script src="script.js"></script></body></html>
